spring.application.name=day41-spring-ai-hybrid-rag

# ===============================
# Groq / Qwen - Chat Model
# ===============================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=qwen/qwen3.6-27b

# ===============================
# Ollama - Embeddings
# ===============================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.model.embedding=ollama

# We only use Ollama for embeddings
spring.ai.ollama.chat.enabled=false

# ===============================
# Neon PostgreSQL
# ===============================
spring.datasource.url=${NEON_DATABASE_URL}
spring.datasource.username=${NEON_DATABASE_USERNAME}
spring.datasource.password=${NEON_DATABASE_PASSWORD}

# ===============================
# PGVector
# ===============================
spring.ai.vectorstore.pgvector.initialize-schema=true

# ===============================
# Disable OpenAI audio
# ===============================
spring.ai.model.audio.speech=none